<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Gestion Menu</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="logo"><h2>Resto<span>Admin</span></h2></div>
        <nav class="navigation">
            <a href="index.html" class="nav-item">Dashboard</a>
            <a href="orders.html" class="nav-item">Commandes</a>
            <a href="menu.html" class="nav-item active">Menu</a>
        </nav>
    </aside>
    <main class="main">
        <h1>Gestion du Menu</h1>
        <div class="panel">
            <div style="display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <input type="text" id="search-input" placeholder="Rechercher..." style="flex: 1; max-width: 300px; padding: 10px; border: 2px solid #FF6B35; border-radius: 8px; box-sizing: border-box;">
                <button id="add-btn" style="padding:10px 20px; background-color: white; border: 2px solid #FF6B35; color: #FF6B35; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s;" onmouseover="this.style.backgroundColor='#FF6B35'; this.style.color='white';" onmouseout="this.style.backgroundColor='white'; this.style.color='#FF6B35';">+ Ajouter un plat</button>
            </div>
            <table id="menu-table">
                <thead><tr><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Image</th><th>Action</th></tr></thead>
                <tbody id="menu-body"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="product-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:8px; width:400px;">
            <h2 id="modal-title">Ajouter un plat</h2>
            <form id="product-form" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
                <input type="hidden" id="product-id">
                <input type="text" id="name" placeholder="Nom" required>
                <input type="text" id="description" placeholder="Description">
                <input type="number" id="price" placeholder="Prix" required>
                <input type="text" id="category" placeholder="Catégorie" required>
                <div style="margin-top: 10px;">
                    <label style="display: block; margin-bottom: 4px; font-size: 0.8rem;">Image actuelle :</label>
                    <img id="current-image" style="max-width: 100px; max-height: 100px; border-radius: 4px; margin-bottom: 4px;" src="" alt="Image actuelle">
                    <input type="file" id="image-file" accept="image/*">
                </div>
                <input type="hidden" id="image-path">
                <button type="submit" id="form-submit" style="background-color: #FF6B35; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;">Enregistrer</button>
                <button type="button" id="close-modal" style="background: none; border: none; color: #6b7280; cursor: pointer; padding: 10px; font-weight: bold;">Annuler</button>
            </form>
        </div>
    </div>
    <script src="js/notifications.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
