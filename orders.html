<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Admin | Commandes</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">R</div>
        <div><h2>Resto<span>Admin</span></h2></div>
      </div>
      <nav class="navigation">
        <p class="nav-title">MENU</p>
        <a href="index.html" class="nav-item">Dashboard</a>
        <a href="orders.html" class="nav-item active">Commandes</a>
        <a href="menu.html" class="nav-item">Menu</a>
      </nav>
    </aside>

    <main class="main">
      <header class="header">
        <h1>Commandes</h1>
        <div style="display: flex; gap: 10px;">
          <button id="add-order-btn" class="btn btn-primary">+ Nouvelle Commande</button>
          <select id="filter-status" class="filter-select" onchange="filterOrders()">
            <option value="all">Tous</option>
            <option value="pending">En attente</option>
            <option value="preparing">En préparation</option>
            <option value="ready">Prête</option>
            <option value="completed">Terminée</option>
            <option value="cancelled">Annulée</option>
          </select>
        </div>
      </header>

        <section class="panel">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Table</th>
                        <th>Total</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body"></tbody>
            </table>
        </section>
    </main>

    <!-- Modal Nouvelle Commande -->
    <div id="order-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:10000;">
        <div style="background:white; padding:20px; border-radius:8px; width:300px;">
            <h2>Nouvelle Commande</h2>
            <form id="order-form" style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
                <input type="number" id="table-num" placeholder="Numéro de table" required style="padding:8px; border:1px solid #ccc; border-radius:4px;">
                <input type="number" id="total-amount" placeholder="Montant total" required style="padding:8px; border:1px solid #ccc; border-radius:4px;">
                <button type="submit" style="padding:10px; background:#FF6B35; color:white; border:none; border-radius:4px; cursor:pointer;">Créer</button>
                <button type="button" id="close-modal" style="padding:10px; background:#ccc; border:none; border-radius:4px; cursor:pointer;">Annuler</button>
            </form>
        </div>
    </div>

    <script src="js/notifications.js"></script>
    <script src="js/orders.js"></script>
  </body>
</html>
