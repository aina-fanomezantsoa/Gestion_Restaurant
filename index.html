<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Admin | Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">R</div>
        <div><h2>Resto<span>Admin</span></h2></div>
      </div>
      <nav class="navigation">
        <p class="nav-title">MENU</p>
        <a href="index.html" class="nav-item active">Dashboard</a>
        <a href="orders.html" class="nav-item">Commandes</a>
        <a href="menu.html" class="nav-item">Menu</a>
      </nav>
    </aside>

    <main class="main">
      <header class="header">
        <h1>Dashboard</h1>
      </header>

      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon orange">☰</div>
          <p>Total commandes</p>
          <h2 id="total-orders">--</h2>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow">◷</div>
          <p>En attente</p>
          <h2 id="pending-orders">--</h2>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header"><h2>Commandes récentes</h2></div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Table</th>
              <th>Total</th>
              <th>Statut</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <!-- Rempli par JS -->
          </tbody>
        </table>
      </section>
    </main>

    <script src="js/dashboard.js"></script>
  </body>
</html>
